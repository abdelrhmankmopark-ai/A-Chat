<!DOCTYPE html><html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <meta name="theme-color" content="#101b2d">
  <meta name="description" content="A-Chat - منصة مراسلة فورية">  <title>A-Chat</title>  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css"></head><body>  <header class="topbar">
    <h1>A-Chat</h1>
    <span>مراسلتك تبدأ هنا</span>
  </header>  <main class="container"><section class="welcome">
  <div class="logo">A</div>
  <h2>أهلاً بك في A-Chat</h2>
  <p>تواصل مع أصدقائك بسهولة وأمان.</p>
</section>

<section class="auth-box">

  <h2>تسجيل الدخول</h2>

  <input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
    autocomplete="email"
  >

  <input
    id="password"
    type="password"
    placeholder="كلمة المرور"
    autocomplete="current-password"
  >

  <button id="loginBtn">تسجيل الدخول</button>

  <button id="signupBtn" class="secondary">
    إنشاء حساب جديد
  </button>

  <p id="message" aria-live="polite"></p>

</section>

  </main>  <script type="module" src="./app.js"></script>  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("A-Chat PWA Ready"))
          .catch(error => console.error("PWA Error:", error));
      });
    }
  </script></body>
</html>
